[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-register"
version = "0.1.0"
description = "Post-training bidirectional registration of open-vocabulary tool tokens"
requires-python = ">=3.9"
dependencies = [
  "accelerate>=1.0,<2",
  "ijson>=3.3",
  "jsonschema>=4.20",
  "peft>=0.13,<1",
  "torch>=2.1",
  "transformers>=4.51,<6",
  "Unidecode==1.3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
